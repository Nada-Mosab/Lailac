<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart - Lailac</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fdfbf7; color: #4a4a4a; }
        .cart-card { background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-custom { background-color: #9ab87a; color: white; border: none; }
        .btn-custom:hover { background-color: #7f9a65; color: white; }
    </style>
</head>
<body class="py-5">

<!--  use min-vh-100 with d-flex to perfectly center the card in the middle of the screen.-->
<div class="container min-vh-80 d-flex align-items-center justify-content-center py-5">
    <div class="row w-100 justify-content-center">
        <div class="col-12 col-lg-9">
            <div class="cart-card p-4 p-md-5 border shadow-sm rounded-4 bg-white">
                <h2 class="mb-4 fw-bold">Your Shopping Cart</h2>
                
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr><th>Product</th>
                            <th>Price</th>
                            <th class="text-end">Action</th></tr>
                        </thead>
                        <tbody id="cart-items"></tbody>
                    </table>
                </div>

                <hr class="my-4">

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
                    <h4 class="m-0">Total: <span id="cart-total">0</span>$</h4>
                    <div class="d-flex gap-2">
                        <a href="index.html" class="btn btn-outline-secondary px-4">Continue Shopping</a>
                        <a href="checkout.html" class="btn btn-success px-4">Proceed to Checkout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function renderCart() {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let container = document.getElementById('cart-items');
        let total = 0;
        container.innerHTML = '';
        cart.forEach((item, index) => {
            total += parseInt(item.price);
            container.innerHTML += `
            <tr>
             <td>${item.name}</td>
             <td>${item.price}$</td>
             <td class="text-end">
               <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">Remove</button>
             </td>
            </tr>`;
        });
        document.getElementById('cart-total').innerText = total;
    }
    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('cart'));
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }
    renderCart();
</script>
</body>
</html>
